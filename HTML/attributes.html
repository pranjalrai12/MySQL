<!-- Attributes -  it provides additional information -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes</title>
</head>
<body>
    <!-- Attributes -->
    <h1 style = "background-color : red" > hello </h1>

    <!-- Core Attributes - Functionality of the element -->

    <!-- ID : it should be unique -->
    <p id="intro">Hello</p>

    <!-- CLASS : it should have a same name -->
    <p class="text">Hello</p>

    <!-- STYLE : it provides styling for web-page  -->
    <p style="color:red;">Hello</p>

</body>
</html>
