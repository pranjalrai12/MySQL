<!-- Quote tags - it is used to add short quotation marks in html 
blockquote - used to display the long quotation 

Marquee tag - used to scroll a image or text horizontally or vertically 
pre tag - used to specify pre formatted text    -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particular Tags</title>
  </head>
  <body>
    <p>He said, <q>Practice makes perfect.</q></p>

    <blockquote>
      Success is not final, failure is not fatal: it is the courage to continue
      that counts.
    </blockquote>

    <marquee>Welcome to My Website</marquee>
  </body>
</html>
