<!-- Lists - it is the collection of items 

Types of lists -
1. Ordered Lists : It displays items with number and letters
2. Unordered Lists : It displays items using bullets

3. Description or definition Lists : used for terms and their descriptions 
Tags used : dl(Description List) , dt(Description Term) , dd(Description Definition) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<ol start="100" reversed>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<ol type="A">
    <li>HTML</li>
    <li>CSS</li>
</ol>

<ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
</ul>

<ul type="square">
    <li>Apple</li>
    <li>Banana</li>
</ul>

<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>

    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
</dl>
</body>
</html>
