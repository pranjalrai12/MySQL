<!-- Div and Span are the grouping element or content 

Div -
1. used to group large sections of the web page 
2. Takes the full width available
3. Span can be written inside the div page 
4. Nested div can be create

Span -
1. Used to group small parts of texts and it is inline element 
2. Takes only as much width as needed
3. Div can not be return inside a span -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and span</title>
</head>
<body>
    <div>
        <h1>About Me</h1>
        <p>I am learning HTML</p>
    </div>

    <span style="color: aqua;">This is my style of writing</span>
</body>
</html>
