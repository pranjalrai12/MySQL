<!-- Tables - It is the structured set of data made up of rows and columns
The main tags used in table :
1. <tr>creates a table row </tr>
2. <th>Creates a table heading</th>
3. <td>Creates the table data </td>
4. <caption>adds a title to the table</caption> -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table border=1px" cellspacing="0px" cellpadding="10px">
    <tr>
        <th>Name</th>
        <th>Age</th>
    </tr>

    <tr>
        <td>Pranjal</td>
        <td>22</td>
    </tr>
</table> <br>

<table border="1">
    <caption>Student Details</caption>

    <tr>
        <th>Name</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>Pranjal</td>
        <td>90</td>
    </tr>
</table>
</body>
</html>
