<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .grid-container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: 80px 80px 80px 80px;
        border: 2px solid;
        gap: 10px;
        padding: 20px;
       }
       #grid-item6{
        grid-row: span 3;
       }
       #grid-item1{
        grid-row: span 4;
       }
       
      
      .item{
        border: 2px solid;
        display: flex;
        justify-content: center;
        align-items: center;
      }

    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="item" id="grid-item1">BOX-1</div>
      <div class="item" id="grid-item2">BOX-2</div>
      <div class="item" id="grid-item3">BOX-3</div>
      <div class="item" id="grid-item4">BOX-4</div>
      <div class="item" id="grid-item5">BOX-5</div>
      <div class="item" id="grid-item6">BOX-6</div>
      <div class="item" id="grid-item7">BOX-7</div>
      <div class="item" id="grid-item8">BOX-8</div>
      <!-- <div class="item" id="grid-item9">BOX-9</div> -->
      <!-- <div class="item" id="grid-item10">BOX-10</div>  -->
       <!-- <div class="item" id="grid-item11">BOX-11</div> -->
      <!-- <div class="item" id="grid-item12">BOX-12</div>  -->
    </div>
  </body>
</html>
