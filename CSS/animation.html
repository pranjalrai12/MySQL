<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            background-color: greenyellow;
        }
        #box{
            height: 200px;
            width: 200px;
            border: 1px solid;
            background-color: red;
            position: relative;
            
            animation-name: FLaksh;
            /* animation-name: LakshGay; */
            animation-duration: 5s;

            animation-iteration-count: 2;

            animation-timing-function: ease-in;

            animation-direction: alternate;
            
        }
        @keyframes LakshGay{
            from{
                width: 200px;
            }
            to{
                width: 1000px;
            }
        }

        @keyframes FLaksh{
            0%{
                left: 0px;
                top: 0px;
            }
            25%{
                left: 0px;
                top: 200px;
            }
            50%{
                left: 200px;
                top: 200px;
            }
            75%{
                left: 200px;
                top: 0px;
                background-color: yellow;
            }
            100%{
                top: 0px;
                left: 0px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="box"></div>
    </div>
</body>
</html>
