<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        height: 400px;
        width: 300px;
        background: url(../HTML/Cristiano_Ronaldo\,_2023.jpg) no-repeat
          center/cover;
        position: absolute;
        margin: 60px 600px;
        border-radius: 10px;
      }
      .text {
        position: absolute;
        top: 75%;
        left: 30%;
        background-color: black;
        width: 100px;
        border-radius: 2px;
        opacity: 0.9;
      }
      .content {
        color: orange;
        position: relative;
        top: 75%;
        left: 30%;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="text">.</div>
      <div class="content">Hello opacity</div>
    </div>
  </body>
</html>
