<!-- z-index : mainly for overlapping -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .BOX {
        height: 250px;
        width: 250px;
        border: 1px solid;
        font-size: 20px;
        position: absolute;
      }
      #box1 {
        background-color: yellowgreen;
        top: 100px;
        left: 150px;
        z-index: 1;
      }
      #box2 {
        background-color: red;
        top: 150px;
        left: 200px;
        z-index: 1;
      }
      #box3 {
        background-color: purple;
        top: 200px;
        left: 250px;
        z-index: 1;
      }
      #box4 {
        background-color: blue;
        top: 300px;
        left: 350px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="box1" class="BOX">BOX-1</div>
    <div id="box2" class="BOX">BOX-2</div>
    <div id="box3" class="BOX">BOX-3</div>
    <div id="box4" class="BOX">BOX-4</div>
  </body>
</html>
