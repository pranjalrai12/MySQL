<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Storage</title>
  </head>

  <body>
    <form action="">

      <input type="email" placeholder="john@gmail.com" id="email" />
      <br />

      <input type="password" placeholder="Enter your password" id="pass" />
      <br />

      <button id="btn">Submit</button>

      <br /><br />

      <input type="email" placeholder="get data email" id="email1" />
      <br />

      <button id="btn1">Get Data</button>
      <br />

      <p id="result"></p>
    </form>

    <script>
      const btn = document.getElementById("btn");

      btn.onclick = function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const pass = document.getElementById("pass").value;

        sessionStorage.setItem(email, pass);

        alert("Data saved to sessionStorage");
      };

      const btn1 = document.getElementById("btn1");

      btn1.onclick = function (e) {
        e.preventDefault();

        const email1 = document.getElementById("email1").value;

        const data = sessionStorage.getItem(email1);

        if (data !== null) {
          document.getElementById("result").textContent = data;
        } else {
          document.getElementById("result").textContent = "Data not found";
        }
      };
    </script>
  </body>
</html>
